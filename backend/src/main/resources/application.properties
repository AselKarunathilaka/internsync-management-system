server.port=${PORT:${SERVER_PORT:19090}}

spring.config.import=optional:file:.env[.properties]
spring.application.name=InternSync
spring.data.mongodb.uri=${MONGODB_URI}
app.version=${APP_VERSION:1.0.0}

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:15173,http://127.0.0.1:15173}

app.jwt.secret=${JWT_SECRET:InternSyncManagementSystemSecretKeyWhichIsAtLeast32BytesLong1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.root=INFO
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

azure.tenant-id=${AZURE_TENANT_ID:}
azure.client-id=${AZURE_CLIENT_ID:}
azure.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/${AZURE_TENANT_ID:}/v2.0}
app.local-email-domain=${APP_LOCAL_EMAIL_DOMAIN:example.com}

# Microsoft Login Feature Flag
app.microsoft-login.enabled=${APP_MICROSOFT_LOGIN_ENABLED:false}

# Proxy Module Config
proxy.module.enabled=${PROXY_MODULE_ENABLED:true}
proxy.access.source=${PROXY_ACCESS_SOURCE:INTERNAL}
proxy.bulk-assignment.enabled=${PROXY_BULK_ASSIGNMENT_ENABLED:true}
proxy.expiry.enabled=${PROXY_EXPIRY_ENABLED:true}
