server.port=${PORT:${SERVER_PORT:19090}}

spring.config.import=optional:file:.env[.properties]
spring.application.name=InternSync
spring.data.mongodb.uri=${MONGODB_URI}
app.version=${APP_VERSION:1.0.0}

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:15173,http://127.0.0.1:15173}

app.jwt.secret=${JWT_SECRET:InternSyncManagementSystemSecretKeyWhichIsAtLeast32BytesLong1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.root=INFO
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
